name: Deploy to MonsterASP.NET

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20"

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Build the React app first. VITE_API_BASE_URL is left empty so the
      # built app calls /api/... as a relative path - same origin as the API
      # it's served from, no CORS needed.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""

      # Drop the built frontend into the API's wwwroot so `dotnet publish`
      # ships it alongside the API - Program.cs serves it as a SPA fallback.
      - name: Copy frontend build into API wwwroot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path backend/BCAS.Api/wwwroot | Out-Null
          Copy-Item -Path frontend/dist/* -Destination backend/BCAS.Api/wwwroot -Recurse -Force

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore backend/BCAS.Api/BCAS.Api.csproj

      - name: Build
        run: dotnet build backend/BCAS.Api/BCAS.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish backend/BCAS.Api/BCAS.Api.csproj
          --configuration Release
          --no-build
          --runtime win-x86
          --self-contained false
          --output ./publish

      # MonsterASP.NET's documented GitHub Actions deploy method: WebDeploy
      # over the four secrets below. Activate WebDeploy in the MonsterASP.NET
      # control panel first to get these values, then add them as repo
      # secrets (Settings -> Secrets and variables -> Actions):
      #   WEBSITE_NAME          e.g. site1234
      #   SERVER_COMPUTER_NAME  e.g. https://site1234.siteasp.net:8172
      #   SERVER_USERNAME
      #   SERVER_PASSWORD
      - name: Deploy to MonsterASP.NET
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: ./publish
